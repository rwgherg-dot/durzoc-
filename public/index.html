<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>Worms Online</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#05060f;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  #leftHud{position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));z-index:5;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:220px}
  .panel{background:rgba(10,12,26,.7);border:1px solid rgba(124,255,178,.15);border-radius:14px;padding:8px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6a7a9a;margin-bottom:2px}
  .value{font-size:18px;font-weight:800;line-height:1;color:#7CFFB2}
  #pingVal{color:#ffd93d;font-size:16px}
  #scorePanel{display:flex;justify-content:space-between;gap:8px}
  #scorePanel .col{flex:1}
  #mapPanel{padding:6px}
  #mapCanvas{display:block;width:100%;height:auto;border-radius:10px;background:#0a0c1a}
  #leaderPanel{padding:8px 12px;max-height:220px;overflow:hidden}
  #leaderTitle{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6a7a9a;margin-bottom:6px}
  #leaderList{font-size:12px;line-height:1.5}
  #leaderList .row{display:flex;justify-content:space-between;gap:6px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  #leaderList .nm{color:#cfd8e6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #leaderList .sc{color:#ffd93d;font-weight:800}
  #boostBar{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:220px;height:10px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden;z-index:5}
  #boostFill{height:100%;width:100%;background:linear-gradient(90deg,#7CFFB2,#4ecca3);transition:width .1s}
  #boostBtn{position:fixed;right:calc(24px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));width:90px;height:90px;border-radius:50%;background:rgba(124,255,178,.18);border:2px solid #7CFFB2;color:#7CFFB2;font-size:13px;font-weight:800;display:none;align-items:center;justify-content:center;z-index:5;user-select:none;box-shadow:0 0 24px rgba(124,255,178,.35)}
  #boostBtn.active{background:rgba(124,255,178,.4)}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:10;background:rgba(5,6,15,.97);opacity:0;pointer-events:none;transition:opacity .4s;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #overlay.show{opacity:1;pointer-events:auto}
  .ov-card{max-width:520px;width:100%}
  .ov-title{font-size:28px;font-weight:800;margin-bottom:6px;color:#7CFFB2;letter-spacing:1px}
  .ov-title.dead{color:#ff6b6b}
  .ov-sub{font-size:14px;color:#8892aa;margin-bottom:18px;line-height:1.5}
  .btn{font-family:inherit;font-size:16px;font-weight:700;color:#05060f;background:linear-gradient(135deg,#7CFFB2,#4ecca3);border:none;border-radius:100px;padding:14px 28px;cursor:pointer;box-shadow:0 8px 32px rgba(78,204,163,.4);margin:4px;-webkit-tap-highlight-color:transparent;min-height:48px}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;color:#7CFFB2;border:2px solid #4ecca3;box-shadow:none}
  .btn.full{display:block;width:100%;margin:6px 0}
  .input{width:100%;font-family:inherit;font-size:18px;font-weight:700;text-align:center;background:rgba(255,255,255,.06);border:2px solid rgba(124,255,178,.3);border-radius:14px;padding:14px;color:#fff;margin-bottom:10px;outline:none;min-height:52px}
  .input:focus{border-color:#7CFFB2}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .status{font-size:13px;color:#8892aa;margin-top:10px;min-height:18px;line-height:1.4}
  .status.err{color:#ff6b6b}
  .status.ok{color:#7CFFB2}
  .ov-hint{font-size:12px;color:#4a5570;margin-top:16px;line-height:1.5}
  .profile-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px}
  .coins{font-size:18px;font-weight:800;color:#ffd93d}
  .admin-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;color:#0a0c1a;background:#ffd93d;padding:3px 8px;border-radius:100px;margin-left:6px}
  .skin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  .skin-cell{aspect-ratio:1;border-radius:12px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:6px;transition:all .15s;position:relative;overflow:hidden}
  .skin-cell.locked{opacity:.45;cursor:not-allowed}
  .skin-cell.locked::after{content:'LOCK';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:800;letter-spacing:1px}
  .skin-cell.owned{border-color:rgba(124,255,178,.5)}
  .skin-cell.active{border-color:#7CFFB2;box-shadow:0 0 18px rgba(124,255,178,.6);transform:scale(1.04)}
  .skin-preview{width:100%;height:0;padding-bottom:100%;border-radius:8px;position:relative;overflow:hidden;margin-bottom:4px}
  .skin-preview-inner{position:absolute;inset:0;border-radius:8px}
  .skin-name{font-size:9px;color:#cfd8e6;text-align:center;line-height:1.1;font-weight:700;z-index:2}
  .skin-rarity{position:absolute;top:3px;right:3px;font-size:8px;font-weight:800;padding:1px 5px;border-radius:100px;z-index:2}
  .r-common{background:#4a5570;color:#fff}
  .r-rare{background:#4ecca3;color:#05060f}
  .r-epic{background:#c44dff;color:#fff}
  .r-legendary{background:#ffd93d;color:#05060f}
  .case-row{display:flex;gap:8px;justify-content:center;margin:12px 0}
  .case-card{flex:1;padding:14px 6px;border-radius:12px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);cursor:pointer;transition:all .15s}
  .case-card:active{transform:scale(.97)}
  .case-card .cn{font-size:12px;font-weight:800;margin-bottom:4px}
  .case-card .cp{font-size:14px;color:#ffd93d;font-weight:800}
  .case-result{font-size:15px;line-height:1.5;margin:12px 0;padding:16px;border-radius:14px;background:rgba(124,255,178,.08);border:1px solid rgba(124,255,178,.3)}
  .checkbox-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 14px;font-size:14px;color:#8892aa}
  .checkbox-row input{width:20px;height:20px;accent-color:#4ecca3}
  #caseReel{position:relative;overflow:hidden;height:90px;margin:16px 0;border-radius:14px;background:rgba(0,0,0,.5);border:1px solid rgba(124,255,178,.3)}
  #caseReelTrack{display:flex;height:100%;will-change:transform}
  .reel-cell{flex:0 0 90px;height:100%;display:flex;align-items:center;justify-content:center;padding:6px;border-right:1px solid rgba(255,255,255,.05)}
  #caseReel::after{content:'';position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#7CFFB2;box-shadow:0 0 12px #7CFFB2;pointer-events:none;z-index:2}
  #caseResultText{font-size:15px;line-height:1.5;margin:12px 0;padding:14px;border-radius:12px;background:rgba(124,255,178,.08);border:1px solid rgba(124,255,178,.3);opacity:0;transition:opacity .3s}
  #caseResultText.show{opacity:1}
  @media (max-width:700px){
    #boostBtn{display:flex}
    #leftHud{width:150px;gap:6px}
    #mapCanvas{max-height:100px}
    #leaderPanel{max-height:130px}
    .value{font-size:15px}
    .ov-title{font-size:22px}
    .skin-grid{grid-template-columns:repeat(3,1fr)}
    #boostBar{width:140px;bottom:calc(16px + env(safe-area-inset-bottom))}
  }
  @media (hover:none) and (pointer:coarse){
    #boostBtn{display:flex}
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="leftHud">
  <div class="panel" id="pingPanel">
    <div class="label">Пинг</div>
    <div class="value" id="pingVal">-- ms</div>
  </div>
  <div class="panel" id="scorePanel">
    <div class="col"><div class="label">Счёт</div><div class="value" id="scoreVal">0</div></div>
    <div class="col"><div class="label">Убийства</div><div class="value" id="killsVal">0</div></div>
  </div>
  <div class="panel" id="mapPanel"><div class="label">Карта</div><canvas id="mapCanvas" width="200" height="200"></canvas></div>
  <div class="panel" id="leaderPanel"><div id="leaderTitle">Игроки</div><div id="leaderList"></div></div>
</div>
<div id="boostBar"><div id="boostFill"></div></div>
<div id="boostBtn">BOOST</div>
<div id="overlay" class="show"><div class="ov-card" id="ovCard"></div></div>

<script>
(function(){
  "use strict";
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var mapCanvas = document.getElementById("mapCanvas");
  var mapCtx = mapCanvas.getContext("2d");
  var scoreVal = document.getElementById("scoreVal");
  var killsVal = document.getElementById("killsVal");
  var pingVal = document.getElementById("pingVal");
  var leaderList = document.getElementById("leaderList");
  var boostFill = document.getElementById("boostFill");
  var boostBtn = document.getElementById("boostBtn");
  var overlay = document.getElementById("overlay");
  var ovCard = document.getElementById("ovCard");

  var viewW=0, viewH=0, DPR=1;
  var camX=0, camY=0;
  var WORLD_W=5000, WORLD_H=5000;

  var ws=null, myId=null, myWorm=null;
  var others=[], foods=[];
  var myName="", targetAngle=0, boosting=false;
  var pointerX=0, pointerY=0, pointerActive=false;
  var dead=false, profile=null;
  var skinCache = {};

  var renderDelay = 0.03;
  var meHistory = [];
  var othersPrev = {}, othersCurr = {}, othersLastTime = 0, othersNextTime = 0;
  var lastInputSend = 0, lastSentAngle = 0;
  var lastPingSend = 0;

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    viewW = window.innerWidth || document.documentElement.clientWidth;
    viewH = window.innerHeight || document.documentElement.clientHeight;
    canvas.width = viewW*DPR; canvas.height = viewH*DPR;
    canvas.style.width = viewW+"px"; canvas.style.height = viewH+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener("resize", resize);

  function onPointer(e){
    var rect = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    pointerX = t.clientX - rect.left;
    pointerY = t.clientY - rect.top;
    pointerActive = true;
  }
  canvas.addEventListener("mousemove", onPointer);
  canvas.addEventListener("touchstart", function(e){ onPointer(e); e.preventDefault(); }, {passive:false});
  canvas.addEventListener("touchmove", function(e){ onPointer(e); e.preventDefault(); }, {passive:false});

  function startBoost(){ boosting = true; boostBtn.classList.add("active"); }
  function stopBoost(){ boosting = false; boostBtn.classList.remove("active"); }
  window.addEventListener("keydown", function(e){
    var k = e.key ? e.key.toLowerCase() : "";
    if (k === " " || k === "shift"){ e.preventDefault(); startBoost(); }
  });
  window.addEventListener("keyup", function(e){
    var k = e.key ? e.key.toLowerCase() : "";
    if (k === " " || k === "shift"){ e.preventDefault(); stopBoost(); }
  });
  canvas.addEventListener("mousedown", startBoost);
  canvas.addEventListener("mouseup", stopBoost);
  boostBtn.addEventListener("touchstart", function(e){ e.preventDefault(); startBoost(); }, {passive:false});
  boostBtn.addEventListener("touchend", function(e){ e.preventDefault(); stopBoost(); }, {passive:false});
  boostBtn.addEventListener("mousedown", startBoost);
  boostBtn.addEventListener("mouseup", stopBoost);

  function wsConnect(){
    if (ws && ws.readyState <= 1) return;
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(proto + "//" + location.host);
    ws.onopen = function(){
      var remembered = null;
      try { remembered = localStorage.getItem("worms_saved_name"); } catch(e){}
      if (remembered) ws.send(JSON.stringify({ t: "profile", name: remembered }));
    };
    ws.onmessage = onMessage;
    ws.onclose = function(){ setTimeout(wsConnect, 2000); };
  }

  function onMessage(ev){
    var msg;
    try { msg = JSON.parse(ev.data); } catch(e){ return; }
    if (msg.t === "pong"){
      var rtt = Math.round(performance.now() - msg.ts);
      pingVal.textContent = rtt + " ms";
      return;
    }
    if (msg.t === "authOk"){ myName = msg.name; return; }
    if (msg.t === "authError"){ setStatus(msg.message, true); return; }
    if (msg.t === "pwdOk"){ setStatus("Пароль изменён", false, true); return; }
    if (msg.t === "pwdError"){ setStatus(msg.message, true); return; }
    if (msg.t === "profile"){ profile = msg; myName = msg.name; buildSkinCache(); showProfileUI(); return; }
    if (msg.t === "leaderboard"){ renderLeaderboard(msg.list || []); return; }
    if (msg.t === "caseResult"){
      if (msg.error){ showCaseError(msg.error); }
      else {
        if (profile){ profile.coins = msg.coins; profile.skins = msg.skins; }
        animateCase(msg.skinId, msg.alreadyOwned, msg.refund);
      }
      return;
    }
    if (msg.t === "skinSet"){ if (profile) profile.activeSkin = msg.activeSkin; showProfileUI(); return; }
    if (msg.t === "joined"){ myId = msg.id; WORLD_W = msg.world.w; WORLD_H = msg.world.h; overlay.className = ""; dead = false; meHistory = []; return; }
    if (msg.t === "respawned"){ myId = msg.id; dead = false; overlay.className = ""; meHistory = []; return; }
    if (msg.t === "error"){ setStatus(msg.message, true); return; }
    if (msg.t === "state"){
      var now = performance.now()/1000;
      if (msg.me){
        meHistory.push({ t: now, data: msg.me });
        while (meHistory.length > 25) meHistory.shift();
      }
      if (msg.worms){
        var newMap = {};
        for (var i=0;i<msg.worms.length;i++) newMap[msg.worms[i].id] = msg.worms[i];
        othersPrev = othersCurr;
        othersCurr = newMap;
        othersLastTime = othersNextTime || now;
        othersNextTime = now;
      }
      if (msg.food) foods = msg.food;
      if (msg.world){ WORLD_W = msg.world.w; WORLD_H = msg.world.h; }
      if (msg.me){
        myWorm = msg.me;
        scoreVal.textContent = myWorm.score;
        killsVal.textContent = myWorm.kills;
        boostFill.style.width = Math.max(0, Math.min(100, myWorm.boostFuel)) + "%";
        if (!myWorm.alive && !dead){ dead = true; showGameOver(myWorm.score, myWorm.kills); }
      }
    }
  }

  function buildSkinCache(){
    skinCache = {};
    for (var i=0;i<profile.allSkins.length;i++){
      var s = profile.allSkins[i];
      skinCache[s.id] = s;
    }
  }

  function getInterpolatedMe(){
    if (!meHistory.length) return null;
    var last = meHistory[meHistory.length-1].data;
    return {
      id: last.id, skin: last.skin, color: last.color, alive: last.alive,
      angle: targetAngle, score: last.score, kills: last.kills,
      boostFuel: last.boostFuel, radius: last.radius,
      x: last.x, y: last.y, segments: last.segments
    };
  }

  function lerpOther(a, b, f){
    var out = { id:b.id, name:b.name, skin:b.skin, color:b.color, alive:b.alive, angle:b.angle,
      score:b.score, kills:b.kills,
      radius:a.radius + (b.radius-a.radius)*f,
      x:a.x + (b.x-a.x)*f, y:a.y + (b.y-a.y)*f, segments: [] };
    var n = Math.min(a.segments.length, b.segments.length);
    for (var i=0;i<n;i++){
      out.segments.push([
        a.segments[i][0] + (b.segments[i][0]-a.segments[i][0])*f,
        a.segments[i][1] + (b.segments[i][1]-a.segments[i][1])*f
      ]);
    }
    return out;
  }
  function getInterpolatedOthers(){
    var now = performance.now()/1000;
    if (!othersNextTime || othersNextTime === othersLastTime) return Object.values(othersCurr);
    var target = now - renderDelay;
    var f = (target - othersLastTime) / (othersNextTime - othersLastTime);
    if (f < 0) f = 0;
    if (f > 1) f = 1;
    var out = [];
    for (var id in othersCurr){
      var b = othersCurr[id];
      var a = othersPrev[id];
      if (!a){ out.push(b); continue; }
      out.push(lerpOther(a, b, f));
    }
    return out;
  }

  function sendInput(){
    if (!ws || ws.readyState !== WebSocket.OPEN || !myWorm || !myWorm.alive) return;
    var now = performance.now();
    if (now - lastInputSend < 33) return;
    var diff = Math.abs(targetAngle - lastSentAngle);
    if (diff < 0.01 && !boosting && now - lastInputSend < 100) return;
    lastInputSend = now;
    lastSentAngle = targetAngle;
    ws.send(JSON.stringify({ t: "input", angle: targetAngle, boost: boosting }));
  }

  function renderLeaderboard(list){
    var html = "";
    for (var i=0;i<list.length;i++){
      var p = list[i];
      var admin = p.isAdmin ? ' <span style="color:#ffd93d;font-size:9px">ADMIN</span>' : '';
      html += '<div class="row"><span class="nm">'+(i+1)+'. '+p.name+admin+'</span><span class="sc">'+p.kills+'</span></div>';
    }
    leaderList.innerHTML = html || '<div style="color:#4a5570;font-size:11px">Пока никого</div>';
  }

  function paintSkinIntoContext(c, skin, w, h){
    var s = skinCache[skin] || { pattern:'solid', c1:'#7CFFB2', c2:'#4ecca3' };
    if (s.pattern === 'gradient'){
      var g = c.createLinearGradient(0,0,w,h);
      g.addColorStop(0, s.c1); g.addColorStop(1, s.c2);
      c.fillStyle = g; c.fillRect(0,0,w,h);
    } else if (s.pattern === 'stripes'){
      c.fillStyle = s.c1; c.fillRect(0,0,w,h);
      c.fillStyle = s.c2;
      var step = Math.max(4, w/10);
      for (var i=-h;i<w+h;i+=step*2){
        c.beginPath();
        c.moveTo(i,0); c.lineTo(i+step,h); c.lineTo(i+step*1.5,h); c.lineTo(i+step*0.5,0);
        c.closePath(); c.fill();
      }
    } else if (s.pattern === 'dots'){
      c.fillStyle = s.c1; c.fillRect(0,0,w,h);
      c.fillStyle = s.c2;
      var d = Math.max(3, w/8);
      for (var yy=d/2; yy<h; yy+=d*1.5){
        for (var xx=d/2; xx<w; xx+=d*1.5){
          c.beginPath(); c.arc(xx,yy,d*0.35,0,Math.PI*2); c.fill();
        }
      }
    } else {
      c.fillStyle = s.c1; c.fillRect(0,0,w,h);
    }
  }

  function tracePath(path){
    ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y);
    if (path.length === 2){ ctx.lineTo(path[1].x, path[1].y); return; }
    for (var j=1;j<path.length-1;j++){
      var mx = (path[j].x + path[j+1].x) / 2;
      var my = (path[j].y + path[j+1].y) / 2;
      ctx.quadraticCurveTo(path[j].x, path[j].y, mx, my);
    }
    var last = path[path.length-1];
    ctx.lineTo(last.x, last.y);
  }

  function drawWormBody(w, isMe){
    if (!w.alive || !w.segments || w.segments.length < 2) return;
    var segs = w.segments;
    var radius = w.radius || 14;
    var skin = skinCache[w.skin] || { pattern:'solid', c1:w.color||'#7CFFB2', c2:'#4ecca3' };
    var path = [];
    for (var i=0;i<segs.length;i++) path.push({x: segs[i][0], y: segs[i][1]});

    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.shadowColor = skin.c1;
    ctx.shadowBlur = isMe ? 22 : 14;
    ctx.strokeStyle = skin.c1;
    ctx.lineWidth = radius*2;
    tracePath(path);
    ctx.stroke();
    ctx.shadowBlur = 0;

    if (skin.pattern === 'gradient'){
      var g = ctx.createLinearGradient(path[path.length-1].x, path[path.length-1].y, path[0].x, path[0].y);
      g.addColorStop(0, skin.c2); g.addColorStop(1, skin.c1);
      ctx.strokeStyle = g; ctx.lineWidth = radius*1.9;
      tracePath(path); ctx.stroke();
    } else if (skin.pattern === 'stripes'){
      ctx.strokeStyle = skin.c2; ctx.lineWidth = radius*1.9;
      ctx.setLineDash([radius*0.9, radius*0.9]);
      tracePath(path); ctx.stroke(); ctx.setLineDash([]);
    } else if (skin.pattern === 'dots'){
      ctx.strokeStyle = skin.c2; ctx.lineWidth = radius*1.9;
      ctx.setLineDash([radius*0.3, radius*1.2]);
      tracePath(path); ctx.stroke(); ctx.setLineDash([]);
    }

    ctx.strokeStyle = "rgba(255,255,255,0.22)";
    ctx.lineWidth = radius*0.7;
    tracePath(path); ctx.stroke();

    var hx = path[0].x, hy = path[0].y;
    var angle = isMe ? targetAngle : (w.angle || 0);
    var dirX = Math.cos(angle), dirY = Math.sin(angle);
    var perpX = -dirY, perpY = dirX;
    var eo = radius*0.5, fw = radius*0.4;
    var e1x = hx+perpX*eo+dirX*fw, e1y = hy+perpY*eo+dirY*fw;
    var e2x = hx-perpX*eo+dirX*fw, e2y = hy-perpY*eo+dirY*fw;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(e1x,e1y,radius*0.32,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(e2x,e2y,radius*0.32,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#0a0c1a";
    ctx.beginPath(); ctx.arc(e1x+dirX*2,e1y+dirY*2,radius*0.16,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(e2x+dirX*2,e2y+dirY*2,radius*0.16,0,Math.PI*2); ctx.fill();
  }

  function drawWorld(nowSec){
    var interpMe = getInterpolatedMe();
    var interpOthers = getInterpolatedOthers();

    ctx.fillStyle = "#05060f"; ctx.fillRect(0,0,viewW,viewH);
    if (interpMe && interpMe.alive){
      var tcx = interpMe.x - viewW/2;
      var tcy = interpMe.y - viewH/2;
      camX += (tcx - camX) * 0.22;
      camY += (tcy - camY) * 0.22;
    }
    camX = Math.max(0, Math.min(WORLD_W-viewW, camX));
    camY = Math.max(0, Math.min(WORLD_H-viewH, camY));
    ctx.save();
    ctx.translate(-camX, -camY);

    ctx.strokeStyle = "rgba(124,255,178,0.06)"; ctx.lineWidth = 1;
    var grid = 80;
    var sx = Math.floor(camX/grid)*grid, sy = Math.floor(camY/grid)*grid;
    ctx.beginPath();
    for (var x=sx;x<camX+viewW+grid;x+=grid){ ctx.moveTo(x,camY); ctx.lineTo(x,camY+viewH); }
    for (var y=sy;y<camY+viewH+grid;y+=grid){ ctx.moveTo(camX,y); ctx.lineTo(camX+viewW,y); }
    ctx.stroke();

    ctx.strokeStyle = "rgba(255,107,107,0.5)"; ctx.lineWidth = 4;
    ctx.strokeRect(0,0,WORLD_W,WORLD_H);

    for (var i=0;i<foods.length;i++){
      var f = foods[i];
      var fx = f[0], fy = f[1], fr = f[2], fc = f[3], ft = f[4];
      if (fx<camX-40||fx>camX+viewW+40||fy<camY-40||fy>camY+viewH+40) continue;
      var pulse = 1 + Math.sin(nowSec*4 + (i*0.7))*0.2;
      var r = fr*pulse;
      var grd = ctx.createRadialGradient(fx,fy,0,fx,fy,r*3);
      grd.addColorStop(0, fc+"aa"); grd.addColorStop(0.5, fc+"33"); grd.addColorStop(1, fc+"00");
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(fx,fy,r*3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = fc;
      ctx.beginPath(); ctx.arc(fx,fy,r,0,Math.PI*2); ctx.fill();
      if (ft === "golden"){
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
        var aa = nowSec*5;
        ctx.beginPath(); ctx.arc(fx,fy,r+5,aa,aa+Math.PI*1.4); ctx.stroke();
      } else if (ft === "bonus"){
        ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(fx,fy,r+3,0,Math.PI*2); ctx.stroke();
      }
    }

    for (var k1=0;k1<interpOthers.length;k1++) drawWormBody(interpOthers[k1], false);
    if (interpMe) drawWormBody(interpMe, true);
    ctx.restore();

    for (var k2=0;k2<interpOthers.length;k2++){
      var w2 = interpOthers[k2];
      if (!w2.alive) continue;
      var px = w2.x-camX, py = w2.y-camY;
      if (px<-60||px>viewW+60||py<-60||py>viewH+60) continue;
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.font = "bold 13px Arial";
      ctx.textAlign = "center";
      ctx.fillText(w2.name + " - " + w2.score, px, py - w2.radius - 10);
    }

    if (interpMe && interpMe.alive){
      var mpx = interpMe.x - camX;
      var mpy = interpMe.y - camY;
      ctx.fillStyle = "#7CFFB2";
      ctx.font = "bold 12px Arial";
      ctx.textAlign = "center";
      ctx.fillText(myName, mpx, mpy - interpMe.radius - 12);
    }

    drawMinimap(interpMe, interpOthers);
  }

  function drawMinimap(interpMe, interpOthers){
    var mw = mapCanvas.width, mh = mapCanvas.height;
    mapCtx.clearRect(0,0,mw,mh);
    mapCtx.fillStyle = "#0a0c1a"; mapCtx.fillRect(0,0,mw,mh);
    mapCtx.strokeStyle = "rgba(124,255,178,0.2)"; mapCtx.lineWidth = 1;
    mapCtx.strokeRect(0.5,0.5,mw-1,mh-1);
    var sx = mw/WORLD_W, sy = mh/WORLD_H;
    for (var i=0;i<interpOthers.length;i++){
      var w = interpOthers[i];
      if (!w.alive) continue;
      mapCtx.fillStyle = w.color || "#ff9f1c";
      mapCtx.beginPath();
      mapCtx.arc(w.x*sx, w.y*sy, 3, 0, Math.PI*2);
      mapCtx.fill();
    }
    if (interpMe && interpMe.alive){
      mapCtx.fillStyle = "#fff";
      mapCtx.beginPath();
      mapCtx.arc(interpMe.x*sx, interpMe.y*sy, 4, 0, Math.PI*2);
      mapCtx.fill();
    }
  }

  function showCaseError(text){
    var w = document.getElementById("caseReelWrap");
    if (!w) return;
    w.innerHTML = '<div class="case-result" style="color:#ff6b6b">'+text+'</div>';
  }

  function animateCase(skinId, alreadyOwned, refund){
    var wrap = document.getElementById("caseReelWrap");
    if (!wrap) return;
    var reelItems = [];
    for (var i=0;i<40;i++){
      var rndSkin = profile.allSkins[Math.floor(Math.random()*profile.allSkins.length)];
      reelItems.push(rndSkin);
    }
    var winner = skinCache[skinId] || profile.allSkins[0];
    reelItems.push(winner);
    for (var k=0;k<10;k++){
      var rnd2 = profile.allSkins[Math.floor(Math.random()*profile.allSkins.length)];
      reelItems.push(rnd2);
    }
    var total = reelItems.length;
    var winIdx = 40;
    var cellW = 90;
    var html = '<div id="caseReel"><div id="caseReelTrack">';
    for (var r=0;r<total;r++){
      var cid = 'reelcv_'+r;
      html += '<div class="reel-cell"><canvas id="'+cid+'" width="60" height="60" style="width:60px;height:60px;border-radius:10px"></canvas></div>';
    }
    html += '</div></div>';
    html += '<div id="caseResultText"></div>';
    wrap.innerHTML = html;
    for (var rr=0;rr<total;rr++){
      var cv = document.getElementById('reelcv_'+rr);
      if (cv) paintSkinIntoContext(cv.getContext("2d"), reelItems[rr].id, 60, 60);
    }
    var track = document.getElementById("caseReelTrack");
    var reel = document.getElementById("caseReel");
    var containerW = reel.clientWidth;
    var targetX = -(winIdx*cellW + cellW/2 - containerW/2);
    var startTime = performance.now();
    var duration = 3200;
    function easeOutQuart(t){ return 1 - Math.pow(1-t, 4); }
    function tick(){
      var t = (performance.now() - startTime) / duration;
      if (t > 1) t = 1;
      var e = easeOutQuart(t);
      var x = 0 + (targetX - 0) * e;
      track.style.transform = 'translateX(' + x + 'px)';
      if (t < 1) { requestAnimationFrame(tick); }
      else {
        var txt = 'Выпал скин: ' + winner.name + ' (' + winner.rarity + ')';
        if (alreadyOwned) txt += ' - уже был, +' + refund + ' монет';
        var res = document.getElementById("caseResultText");
        res.textContent = txt;
        res.classList.add("show");
        var coinEl = ovCard.querySelector(".coins");
        if (coinEl) coinEl.textContent = profile.coins;
      }
    }
    requestAnimationFrame(tick);
  }

  function joinGame(){
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "join", name: myName }));
  }

  function showGameOver(score, kills){
    overlay.className = "show";
    ovCard.innerHTML =
      '<div class="ov-title dead">Ты врезался</div>' +
      '<div class="ov-sub">Счёт: ' + score + '<br>Убийств: ' + kills + '</div>' +
      '<button class="btn full" id="btnRespawn">Возродиться</button>' +
      '<button class="btn ghost full" id="btnQuit">В профиль</button>';
    document.getElementById("btnRespawn").onclick = function(){
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "respawn" }));
    };
    document.getElementById("btnQuit").onclick = function(){
      myWorm = null; others = []; foods = []; meHistory = [];
      showProfileUI();
    };
  }

  function setStatus(txt, isErr, isOk){
    var el = document.getElementById("statusText");
    if (!el) return;
    el.textContent = txt || "";
    el.className = "status" + (isErr ? " err" : (isOk ? " ok" : ""));
  }

  function loop(){
    var t = performance.now()/1000;
    if (myWorm && myWorm.alive && pointerActive){
      var interp = getInterpolatedMe() || myWorm;
      var wx = pointerX + camX;
      var wy = pointerY + camY;
      targetAngle = Math.atan2(wy - interp.y, wx - interp.x);
    }
    var nowPing = performance.now();
    if (nowPing - lastPingSend > 1000 && ws && ws.readyState === 1){
      lastPingSend = nowPing;
      ws.send(JSON.stringify({ t: "ping", ts: nowPing }));
    }
    sendInput();
    drawWorld(t);
    requestAnimationFrame(loop);
  }

  resize();
  wsConnect();
  showIntroUI();
  requestAnimationFrame(loop);
})();
