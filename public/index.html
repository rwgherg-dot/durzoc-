<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Worms Online</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#05060f;font-family:Arial,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  #hud{position:fixed;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;pointer-events:none;z-index:5;font-size:14px;font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap}
  .panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 14px}
  .label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6a7a9a;margin-bottom:2px}
  .value{font-size:20px;font-weight:800;line-height:1;color:#7CFFB2}
  #boostBar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:220px;height:10px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden;z-index:5}
  #boostFill{height:100%;width:100%;background:linear-gradient(90deg,#7CFFB2,#4ecca3);transition:width .1s}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:10;background:rgba(5,6,15,.96);opacity:0;pointer-events:none;transition:opacity .4s;overflow-y:auto}
  #overlay.show{opacity:1;pointer-events:auto}
  .ov-card{max-width:480px;width:100%}
  .ov-title{font-size:26px;font-weight:800;margin-bottom:6px;color:#7CFFB2}
  .ov-title.dead{color:#ff6b6b}
  .ov-sub{font-size:14px;color:#8892aa;margin-bottom:18px;line-height:1.5}
  .btn{font-family:inherit;font-size:16px;font-weight:700;color:#05060f;background:#4ecca3;border:none;border-radius:100px;padding:14px 32px;cursor:pointer;box-shadow:0 8px 32px rgba(78,204,163,.4);margin:4px;-webkit-tap-highlight-color:transparent}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:transparent;color:#7CFFB2;border:2px solid #4ecca3;box-shadow:none}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .input{width:100%;font-family:inherit;font-size:20px;font-weight:800;text-align:center;background:rgba(255,255,255,.06);border:2px solid rgba(124,255,178,.3);border-radius:14px;padding:14px;color:#fff;margin-bottom:12px;outline:none}
  .input:focus{border-color:#7CFFB2}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .code-big{font-size:38px;font-weight:900;letter-spacing:6px;color:#7CFFB2;background:rgba(124,255,178,.08);border:2px dashed rgba(124,255,178,.4);border-radius:16px;padding:16px;margin:12px 0;cursor:pointer}
  .status{font-size:13px;color:#8892aa;margin-top:10px;min-height:18px;line-height:1.4}
  .status.err{color:#ff6b6b}
  .ov-hint{font-size:11px;color:#4a5570;margin-top:16px;line-height:1.5}
  #boostBtn{position:fixed;right:24px;bottom:24px;width:80px;height:80px;border-radius:50%;background:rgba(124,255,178,.15);border:2px solid #7CFFB2;color:#7CFFB2;font-size:13px;font-weight:800;display:none;align-items:center;justify-content:center;z-index:5;user-select:none}
  @media (max-width:600px){#boostBtn{display:flex}.ov-title{font-size:22px}}
  .profile-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px}
  .coins{font-size:18px;font-weight:800;color:#ffd93d}
  .admin-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;color:#0a0c1a;background:#ffd93d;padding:3px 8px;border-radius:100px;margin-left:6px}
  .skin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  .skin-cell{aspect-ratio:1;border-radius:12px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:6px;transition:all .15s;position:relative}
  .skin-cell.owned{border-color:rgba(124,255,178,.5)}
  .skin-cell.active{border-color:#7CFFB2;box-shadow:0 0 16px rgba(124,255,178,.5)}
  .skin-dot{width:26px;height:26px;border-radius:50%;margin-bottom:4px}
  .skin-name{font-size:9px;color:#8892aa;text-align:center;line-height:1.1}
  .skin-rarity{position:absolute;top:3px;right:3px;font-size:8px;font-weight:800;padding:1px 5px;border-radius:100px}
  .r-common{background:#4a5570;color:#fff}
  .r-rare{background:#4ecca3;color:#05060f}
  .r-epic{background:#c44dff;color:#fff}
  .r-legendary{background:#ffd93d;color:#05060f}
  .case-row{display:flex;gap:8px;justify-content:center;margin:12px 0}
  .case-card{flex:1;padding:12px 6px;border-radius:12px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);cursor:pointer;transition:all .15s}
  .case-card:active{transform:scale(.97)}
  .case-card .cn{font-size:11px;font-weight:800;margin-bottom:4px}
  .case-card .cp{font-size:13px;color:#ffd93d;font-weight:800}
  .case-result{font-size:15px;line-height:1.5;margin:12px 0;padding:16px;border-radius:14px;background:rgba(124,255,178,.08);border:1px solid rgba(124,255,178,.3)}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="hud">
  <div class="panel"><div class="label">Счёт</div><div class="value" id="scoreVal">0</div></div>
  <div class="panel"><div class="label">Убийства</div><div class="value" id="killsVal">0</div></div>
</div>
<div id="boostBar"><div id="boostFill"></div></div>
<div id="boostBtn">BOOST</div>
<div id="overlay" class="show"><div class="ov-card" id="ovCard"></div></div>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var scoreVal = document.getElementById("scoreVal");
  var killsVal = document.getElementById("killsVal");
  var boostFill = document.getElementById("boostFill");
  var boostBtn = document.getElementById("boostBtn");
  var overlay = document.getElementById("overlay");
  var ovCard = document.getElementById("ovCard");

  var viewW = 0, viewH = 0, DPR = 1;
  var camX = 0, camY = 0;
  var WORLD_W = 4000, WORLD_H = 4000;

  var ws = null;
  var myId = null;
  var myWorm = null;
  var others = [];
  var foods = [];
  var roomCode = "";
  var connected = false;
  var myName = "";
  var targetAngle = 0;
  var boosting = false;
  var pointerX = 0, pointerY = 0, pointerActive = false;
  var dead = false;

  var profile = null;

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    viewW = window.innerWidth || document.documentElement.clientWidth;
    viewH = window.innerHeight || document.documentElement.clientHeight;
    canvas.width = viewW*DPR; canvas.height = viewH*DPR;
    canvas.style.width = viewW+"px"; canvas.style.height = viewH+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener("resize", resize);

  function onPointer(e){
    var rect = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    pointerX = t.clientX - rect.left;
    pointerY = t.clientY - rect.top;
    pointerActive = true;
  }
  canvas.addEventListener("mousemove", onPointer);
  canvas.addEventListener("touchstart", function(e){ onPointer(e); e.preventDefault(); }, {passive:false});
  canvas.addEventListener("touchmove", function(e){ onPointer(e); e.preventDefault(); }, {passive:false});

  function startBoost(){ boosting = true; }
  function stopBoost(){ boosting = false; }
  window.addEventListener("keydown", function(e){
    var k = e.key ? e.key.toLowerCase() : "";
    if (k === " " || k === "shift") { e.preventDefault(); startBoost(); }
  });
  window.addEventListener("keyup", function(e){
    var k = e.key ? e.key.toLowerCase() : "";
    if (k === " " || k === "shift") { e.preventDefault(); stopBoost(); }
  });
  canvas.addEventListener("mousedown", startBoost);
  canvas.addEventListener("mouseup", stopBoost);
  canvas.addEventListener("touchstart", function(){ startBoost(); }, {passive:true});
  canvas.addEventListener("touchend", function(){ stopBoost(); }, {passive:true});
  boostBtn.addEventListener("touchstart", function(e){ e.preventDefault(); startBoost(); }, {passive:false});
  boostBtn.addEventListener("touchend", function(e){ e.preventDefault(); stopBoost(); }, {passive:false});
  boostBtn.addEventListener("mousedown", startBoost);
  boostBtn.addEventListener("mouseup", stopBoost);

  function wsConnect(){
    if (ws && ws.readyState <= 1) return;
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(proto + "//" + location.host);
    ws.onopen = function(){
      if (myName) ws.send(JSON.stringify({ t: "profile", name: myName }));
    };
    ws.onmessage = onMessage;
    ws.onerror = function(){};
    ws.onclose = function(){
      connected = false;
      setTimeout(wsConnect, 2000);
    };
  }

  function onMessage(ev){
    var msg;
    try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    if (msg.t === "profile"){
      profile = msg;
      showProfileUI();
    } else if (msg.t === "caseResult"){
      if (msg.error){
        showCaseResult("Недостаточно монет", null);
      } else {
        if (profile){
          profile.coins = msg.coins;
          profile.skins = msg.skins;
        }
        showCaseResult(null, msg);
      }
    } else if (msg.t === "skinSet"){
      if (profile) profile.activeSkin = msg.activeSkin;
      showSkinsUI();
    } else if (msg.t === "joined"){
      myId = msg.id;
      connected = true;
      WORLD_W = msg.world.w; WORLD_H = msg.world.h;
      overlay.className = "";
      dead = false;
    } else if (msg.t === "respawned"){
      myId = msg.id;
      dead = false;
      overlay.className = "";
    } else if (msg.t === "state"){
      myWorm = msg.me;
      others = msg.worms || [];
      if (msg.food) foods = msg.food;
      if (msg.world){ WORLD_W = msg.world.w; WORLD_H = msg.world.h; }
      if (myWorm){
        scoreVal.textContent = myWorm.score;
        killsVal.textContent = myWorm.kills;
        boostFill.style.width = Math.max(0, Math.min(100, myWorm.boostFuel)) + "%";
        if (!myWorm.alive && !dead){
          dead = true;
          showGameOver(myWorm.score, myWorm.kills);
        }
      }
    }
  }

  function sendInput(){
    if (!ws || ws.readyState !== WebSocket.OPEN || !myWorm || !myWorm.alive) return;
    ws.send(JSON.stringify({ t: "input", angle: targetAngle, boost: boosting }));
  }

  function drawWorld(now){
    ctx.fillStyle = "#05060f"; ctx.fillRect(0,0,viewW,viewH);
    if (myWorm && myWorm.alive){
      var tcx = myWorm.x - viewW/2;
      var tcy = myWorm.y - viewH/2;
      camX += (tcx-camX)*0.18;
      camY += (tcy-camY)*0.18;
    }
    camX = Math.max(0, Math.min(WORLD_W-viewW, camX));
    camY = Math.max(0, Math.min(WORLD_H-viewH, camY));
    ctx.save();
    ctx.translate(-camX, -camY);

    ctx.strokeStyle = "rgba(124,255,178,0.06)";
    ctx.lineWidth = 1;
    var grid = 80;
    var sx = Math.floor(camX/grid)*grid;
    var sy = Math.floor(camY/grid)*grid;
    ctx.beginPath();
    for (var x=sx;x<camX+viewW+grid;x+=grid){ ctx.moveTo(x,camY); ctx.lineTo(x,camY+viewH); }
    for (var y=sy;y<camY+viewH+grid;y+=grid){ ctx.moveTo(camX,y); ctx.lineTo(camX+viewW,y); }
    ctx.stroke();

    ctx.strokeStyle = "rgba(255,107,107,0.5)";
    ctx.lineWidth = 4;
    ctx.strokeRect(0,0,WORLD_W,WORLD_H);

    for (var i=0;i<foods.length;i++){
      var f = foods[i];
      var fx = f[0], fy = f[1], fr = f[2], fc = f[3], ft = f[4];
      if (fx<camX-40||fx>camX+viewW+40||fy<camY-40||fy>camY+viewH+40) continue;
      var pulse = 1 + Math.sin(now*0.004 + (i*0.7))*0.2;
      var r = fr*pulse;
      var grd = ctx.createRadialGradient(fx,fy,0,fx,fy,r*3);
      grd.addColorStop(0, fc+"aa");
      grd.addColorStop(0.5, fc+"33");
      grd.addColorStop(1, fc+"00");
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(fx,fy,r*3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = fc;
      ctx.beginPath(); ctx.arc(fx,fy,r,0,Math.PI*2); ctx.fill();
      if (ft === "golden"){
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
        var aa = now*0.005;
        ctx.beginPath(); ctx.arc(fx,fy,r+5,aa,aa+Math.PI*1.4); ctx.stroke();
      } else if (ft === "bonus"){
        ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(fx,fy,r+3,0,Math.PI*2); ctx.stroke();
      }
    }

    for (var k=0;k<others.length;k++) drawWormBody(others[k], false);
    if (myWorm) drawWormBody(myWorm, true);
    ctx.restore();

    for (var k2=0;k2<others.length;k2++){
      var w2 = others[k2];
      if (!w2.alive) continue;
      var px = w2.x-camX, py = w2.y-camY;
      if (px<-60||px>viewW+60||py<-60||py>viewH+60) continue;
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.font = "bold 13px Arial";
      ctx.textAlign = "center";
      ctx.fillText(w2.name + " - " + w2.score, px, py - w2.radius - 10);
    }

    drawMinimap();
  }

  function drawWormBody(w, isMe){
    if (!w.alive || !w.segments || w.segments.length < 2) return;
    var segs = w.segments;
    var color = w.color || "#7CFFB2";
    var radius = w.radius || 14;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = isMe ? 20 : 12;
    ctx.lineWidth = radius*2;
    ctx.beginPath();
    ctx.moveTo(segs[0][0], segs[0][1]);
    for (var i=1;i<segs.length;i++) ctx.lineTo(segs[i][0], segs[i][1]);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = radius*1.05;
    ctx.stroke();

    var hx = segs[0][0], hy = segs[0][1];
    var angle = w.angle || 0;
    var dirX = Math.cos(angle), dirY = Math.sin(angle);
    var perpX = -dirY, perpY = dirX;
    var eo = radius*0.5, fw = radius*0.4;
    var e1x = hx+perpX*eo+dirX*fw, e1y = hy+perpY*eo+dirY*fw;
    var e2x = hx-perpX*eo+dirX*fw, e2y = hy-perpY*eo+dirY*fw;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(e1x,e1y,radius*0.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(e2x,e2y,radius*0.3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#0a0c1a";
    ctx.beginPath(); ctx.arc(e1x+dirX*2,e1y+dirY*2,radius*0.15,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(e2x+dirX*2,e2y+dirY*2,radius*0.15,0,Math.PI*2); ctx.fill();
  }

  function drawMinimap(){
    var mmW = 140, mmH = 140;
    var mmX = viewW - mmW - 16;
    var mmY = viewH - mmH - 16;
    var pad = 6;
    ctx.fillStyle = "rgba(5,6,15,0.75)";
    ctx.strokeStyle = "rgba(124,255,178,0.4)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(mmX, mmY, mmW, mmH, 12);
    else ctx.rect(mmX, mmY, mmW, mmH);
    ctx.fill(); ctx.stroke();
    var innerW = mmW - pad*2, innerH = mmH - pad*2;
    var sx = innerW / WORLD_W, sy = innerH / WORLD_H;
    for (var i=0;i<others.length;i++){
      var w = others[i];
      if (!w.alive) continue;
      ctx.fillStyle = w.color || "#ff9f1c";
      ctx.beginPath();
      ctx.arc(mmX + pad + w.x*sx, mmY + pad + w.y*sy, 3, 0, Math.PI*2);
      ctx.fill();
    }
    if (myWorm && myWorm.alive){
      var mx = mmX + pad + myWorm.x*sx;
      var my = mmY + pad + myWorm.y*sy;
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "#fff";
      ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(mx, my, 4, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.lineTo(mx + Math.cos(myWorm.angle)*8, my + Math.sin(myWorm.angle)*8);
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.font = "10px Arial";
    ctx.textAlign = "center";
    ctx.fillText("КАРТА", mmX + mmW/2, mmY - 6);
  }

  function showLoginUI(){
    overlay.className = "show";
    ovCard.innerHTML =
      '<div class="ov-title">Worms Online</div>' +
      '<div class="ov-sub">Введите имя. Для админа: admin worms</div>' +
      '<input class="input" id="nameInput" maxlength="16" placeholder="ИМЯ">' +
      '<button class="btn" id="btnEnter">Войти</button>' +
      '<div class="status" id="statusText"></div>';
    var ni = document.getElementById("nameInput");
    try{ ni.value = localStorage.getItem("worms_name") || ""; }catch(e){}
    ni.focus();
    ni.addEventListener("keydown", function(e){ if (e.key === "Enter") enter(); });
    document.getElementById("btnEnter").onclick = enter;
    function enter(){
      var n = (ni.value || "").trim().slice(0,16);
      if (!n){ setStatus("Введите имя", true); return; }
      myName = n;
      try{ localStorage.setItem("worms_name", n); }catch(e){}
      if (!ws || ws.readyState !== 1){
        wsConnect();
        setTimeout(function(){
          if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "profile", name: myName }));
        }, 800);
      } else {
        ws.send(JSON.stringify({ t: "profile", name: myName }));
      }
    }
  }

  function showProfileUI(){
    overlay.className = "show";
    var adminBadge = profile.isAdmin ? '<span class="admin-badge">ADMIN</span>' : '';
    var cells = "";
    var skinMap = {};
    for (var i=0;i<profile.allSkins.length;i++) skinMap[profile.allSkins[i].id] = profile.allSkins[i];
    for (var j=0;j<profile.skins.length;j++){
      var sk = skinMap[profile.skins[j]];
      if (!sk) continue;
      var active = sk.id === profile.activeSkin ? " active" : "";
      var rCls = "r-" + sk.rarity;
      cells += '<div class="skin-cell owned'+active+'" data-skin="'+sk.id+'">' +
        '<span class="skin-rarity '+rCls+'">'+sk.rarity+'</span>' +
        '<div class="skin-dot" style="background:'+sk.color+'"></div>' +
        '<div class="skin-name">'+sk.name+'</div>' +
        '</div>';
    }
    ovCard.innerHTML =
      '<div class="profile-top">' +
        '<div><div style="font-size:12px;color:#8892aa">Игрок</div><div style="font-size:16px;font-weight:800">'+profile.name+adminBadge+'</div></div>' +
        '<div style="text-align:right"><div style="font-size:10px;color:#8892aa">МОНЕТЫ</div><div class="coins">'+profile.coins+'</div></div>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:#8892aa;margin-bottom:12px">' +
        '<span>Убийств: '+profile.kills+'</span><span>Смертей: '+profile.deaths+'</span>' +
      '</div>' +
      '<div class="row" style="margin-bottom:12px">' +
        '<button class="btn" id="btnPlay">Играть</button>' +
        '<button class="btn ghost" id="btnCases">Кейсы</button>' +
      '</div>' +
      '<div style="font-size:13px;color:#8892aa;text-align:left;margin-bottom:6px">Мои скины:</div>' +
      '<div class="skin-grid">'+cells+'</div>' +
      '<div class="status" id="statusText"></div>';
    document.getElementById("btnPlay").onclick = showPlayUI;
    document.getElementById("btnCases").onclick = showCasesUI;
    var cellsEl = ovCard.querySelectorAll(".skin-cell");
    for (var c=0;c<cellsEl.length;c++){
      cellsEl[c].onclick = function(){
        var sid = this.getAttribute("data-skin");
        if (ws && ws.readyState === 1){
          ws.send(JSON.stringify({ t: "setSkin", name: myName, skinId: sid, wormId: myId }));
        }
      };
    }
  }

  function showCasesUI(){
    overlay.className = "show";
    var casesHtml = "";
    for (var i=0;i<profile.cases.length;i++){
      var c = profile.cases[i];
      casesHtml += '<div class="case-card" data-case="'+c.id+'">' +
        '<div class="cn">'+c.name+'</div>' +
        '<div class="cp">'+c.price+'</div>' +
        '</div>';
    }
    ovCard.innerHTML =
      '<div class="ov-title">Кейсы</div>' +
      '<div class="ov-sub">Монет: <span class="coins">'+profile.coins+'</span></div>' +
      '<div class="case-row">'+casesHtml+'</div>' +
      '<div id="caseResultWrap"></div>' +
      '<button class="btn ghost" id="btnBack">Назад</button>';
    document.getElementById("btnBack").onclick = showProfileUI;
    var cards = ovCard.querySelectorAll(".case-card");
    for (var c=0;c<cards.length;c++){
      cards[c].onclick = function(){
        var cid = this.getAttribute("data-case");
        if (ws && ws.readyState === 1){
          ws.send(JSON.stringify({ t: "openCase", name: myName, caseId: cid }));
        }
      };
    }
  }

  function showCaseResult(errorText, msg){
    var wrap = document.getElementById("caseResultWrap");
    if (!wrap) return;
    if (errorText){
      wrap.innerHTML = '<div class="case-result" style="color:#ff6b6b">'+errorText+'</div>';
      return;
    }
    var sk = null;
    for (var i=0;i<profile.allSkins.length;i++) if (profile.allSkins[i].id === msg.skinId) sk = profile.allSkins[i];
    var txt = sk ? ('Выпал скин: ' + sk.name + ' (' + sk.rarity + ')') : 'Скин получен';
    if (msg.alreadyOwned) txt += ' - уже был, компенсация ' + msg.refund;
    wrap.innerHTML = '<div class="case-result">'+txt+'</div>';
    var coinEl = ovCard.querySelector(".coins");
    if (coinEl) coinEl.textContent = profile.coins;
  }

  function showSkinsUI(){ showProfileUI(); }

  function showPlayUI(){
    overlay.className = "show";
    ovCard.innerHTML =
      '<div class="ov-title">Игра</div>' +
      '<div class="ov-sub">Создай комнату или войди по коду</div>' +
      '<div class="row" style="margin-bottom:12px">' +
        '<button class="btn" id="btnHost">Создать комнату</button>' +
        '<button class="btn ghost" id="btnJoin">Войти по коду</button>' +
      '</div>' +
      '<button class="btn ghost" id="btnBack">Назад в профиль</button>' +
      '<div class="status" id="statusText"></div>' +
      '<div class="ov-hint">Мышь или палец - поворот к курсору. Пробел / Shift / BOOST - ускорение.</div>';
    document.getElementById("btnBack").onclick = showProfileUI;
    document.getElementById("btnHost").onclick = function(){
      var code = genCode();
      showRoomUI(code);
      joinGame(code);
    };
    document.getElementById("btnJoin").onclick = showJoinUI;
  }

  function showJoinUI(){
    overlay.className = "show";
    ovCard.innerHTML =
      '<div class="ov-title">Войти по коду</div>' +
      '<div class="ov-sub">Код из 5 символов</div>' +
      '<input class="input" id="codeInput" maxlength="5" placeholder="КОД" autocomplete="off">' +
      '<div class="row"><button class="btn" id="btnGo">Войти</button><button class="btn ghost" id="btnBack">Назад</button></div>' +
      '<div class="status" id="statusText"></div>';
    document.getElementById("btnBack").onclick = showPlayUI;
    var inp = document.getElementById("codeInput");
    inp.focus();
    inp.addEventListener("input", function(){ inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,5); });
    document.getElementById("btnGo").onclick = function(){
      var c = (inp.value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
      if (c.length !== 5){ setStatus("Код - 5 символов", true); return; }
      joinGame(c);
    };
  }

  function showRoomUI(code){
    overlay.className = "show";
    ovCard.innerHTML =
      '<div class="ov-title">Комната создана</div>' +
      '<div class="ov-sub">Код для друга:</div>' +
      '<div class="code-big" id="codeBig">' + code + '</div>' +
      '<div class="ov-sub">Нажми, чтобы скопировать</div>' +
      '<div class="status" id="statusText">Подключаемся...</div>';
    var cb = document.getElementById("codeBig");
    cb.onclick = function(){
      try{
        if (navigator.clipboard) navigator.clipboard.writeText(code);
        else { var ta=document.createElement("textarea"); ta.value=code; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }
        cb.textContent = "Скопировано!";
        setTimeout(function(){ cb.textContent = code; }, 1200);
      }catch(e){}
    };
  }

  function joinGame(code){
    roomCode = code;
    if (!ws || ws.readyState !== 1){
      wsConnect();
      setTimeout(function(){
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "join", room: code, name: myName }));
      }, 800);
    } else {
      ws.send(JSON.stringify({ t: "join", room: code, name: myName }));
    }
  }

  function showGameOver(score, kills){
    overlay.className = "show";
    ovCard.innerHTML =
      '<div class="ov-title dead">Ты врезался</div>' +
      '<div class="ov-sub">Счёт: ' + score + '<br>Убийств: ' + kills + '</div>' +
      '<div class="row">' +
        '<button class="btn" id="btnRespawn">Возродиться</button>' +
        '<button class="btn ghost" id="btnQuit">В профиль</button>' +
      '</div>';
    document.getElementById("btnRespawn").onclick = function(){
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "respawn" }));
    };
    document.getElementById("btnQuit").onclick = function(){
      connected = false; myWorm = null; others = []; foods = [];
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "profile", name: myName }));
      else showProfileUI();
    };
  }

  function setStatus(txt, isErr){
    var el = document.getElementById("statusText");
    if (!el) return;
    el.textContent = txt || "";
    el.className = "status" + (isErr ? " err" : "");
  }

  function genCode(){
    var s = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", out = "";
    for (var i=0;i<5;i++) out += s[Math.floor(Math.random()*s.length)];
    return out;
  }

  function loop(now){
    if (myWorm && myWorm.alive && pointerActive){
      targetAngle = Math.atan2(pointerY + camY - myWorm.y, pointerX + camX - myWorm.x);
    }
    sendInput();
    drawWorld(now);
    requestAnimationFrame(loop);
  }

  resize();
  wsConnect();
  showLoginUI();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
